  if (!v) return '-';
  try { return new Intl.DateTimeFormat('vi-VN', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(v)); } catch { return v; }
}
function relativeTime(v) {
  const diff = Date.now() - new Date(v).getTime();
  const mins = Math.max(0, Math.round(diff / 60000));
  if (mins < 1) return 'vừa xong';
  if (mins < 60) return `${mins} phút trước`;
  const h = Math.round(mins / 60);
  if (h < 24) return `${h} giờ trước`;
  const d = Math.round(h / 24);
  return `${d} ngày trước`;
}
function normalizeText(v = '') {

}

}

async function bootstrap() {
  const shareToken = new URLSearchParams(location.search).get('share') || '';
  if (shareToken) {
    state.publicShareToken = shareToken;
    await loadPublicShare(shareToken);
    render();
    return;
  }

  if (!cloudMode) {
    demoLoad();
    let rememberedId = '';
    try { rememberedId = localStorage.getItem(DEMO_SESSION_KEY) || sessionStorage.getItem(DEMO_SESSION_KEY) || ''; } catch {}
    if (rememberedId) {
      const employee = state.employees.find(e => String(e.id) === String(rememberedId) && e.active !== false);
      if (employee) {
        state.user = { id: employee.id, email: employee.email };
        state.profile = { ...employee };
        state.view = employee.role === 'admin' ? 'overview' : 'rooms';
      }
    }
    try {
      const bc = new BroadcastChannel('kho-phong-demo-v3');
      bc.onmessage = () => {
        demoLoad();
        if (state.selectedRoom) state.selectedRoom = getRoom(state.selectedRoom.id);
        render();
        toast('Kho phòng vừa được cập nhật ở tab khác');
      };
    } catch {}
    render();
    return;
  }

  const { data: { session } } = await supabase.auth.getSession();
  state.accessToken = session?.access_token || '';
  const remember = localStorage.getItem(REMEMBER_LOGIN_KEY);
  const sessionOnly = sessionStorage.getItem(REMEMBER_LOGIN_KEY) === 'session';
  if (session?.user && remember === '0' && !sessionOnly) {
    await supabase.auth.signOut();
  } else if (session?.user) {
    await hydrateUser(session.user);
  }
  supabase.auth.onAuthStateChange(async (_event, sessionNow) => {
    state.accessToken = sessionNow?.access_token || '';
    if (sessionNow?.user) await hydrateUser(sessionNow.user);
    else {
      state.user = null; state.profile = null; state.rooms = []; state.employees = []; state.activity = []; state.customers = []; state.shares = []; state.employeeRevenue = []; state.projects = []; state.chatDirectory=[]; state.chatConversations=[]; state.chatMembers=[]; state.chatMessages=[]; state.chatUnread={}; state.selectedConversationId=null; state.notifications=[]; state.notificationModal=false; state.pushSubscription=null;
      if (state.realtimeChannel) { await supabase.removeChannel(state.realtimeChannel); state.realtimeChannel = null; }
      render();
    }
  });
  render();
}

  const { data: profile, error } = await supabase.from(DB.profiles).select('*').eq('id', user.id).single();

    state.profile = null;
    await supabase.auth.signOut();
    return;
  }
  state.profile = profile;
  if (firstHydrate) { state.view = profile.role === 'admin' ? 'overview' : 'rooms'; state.adminTab = 'activity'; }
  try { state.favorites = new Set(JSON.parse(localStorage.getItem(DEMO_FAVORITES_KEY)) || []); } catch { state.favorites = new Set(); }
  await Promise.all([loadRooms(), loadProjects(), loadChatData(), loadNotifications(), isAdmin() ? loadEmployees() : Promise.resolve(), isAdmin() ? loadActivity() : Promise.resolve(), isAdmin() ? loadCustomers() : Promise.resolve(), isAdmin() ? loadShares() : Promise.resolve(), isAdmin() ? loadEmployeeRevenue() : Promise.resolve(), isAdmin() ? loadQuickOptionsCloud() : Promise.resolve()]);
  await initPushClient();

function subscribeRealtime() {

      render();
      toast(`${payload.new?.code || payload.old?.code || 'Kho phòng'} vừa được cập nhật`);
    })

      await loadChatDirectory(); if (isAdmin()) await loadEmployees(); render();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: DB.roomEvents }, async () => {
      if (isAdmin()) { await loadActivity(); render(); }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: DB.customers }, async () => {
      if (isAdmin()) { await loadCustomers(); render(); }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: DB.roomShares }, async () => {
      if (isAdmin()) { await loadShares(); render(); }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: DB.employeeRevenue }, async () => {
      if (isAdmin()) { await loadEmployeeRevenue(); render(); }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: DB.projects }, async () => {
      await Promise.all([loadProjects(), loadRooms()]); render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: DB.chatConversations }, async () => { await refreshChatMeta(); render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: DB.chatMembers }, async () => { await refreshChatMeta(); if(state.selectedConversationId) await loadChatMessages(state.selectedConversationId,false); render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: DB.chatMessages }, async payload => {
      await refreshChatMeta();
      if(state.selectedConversationId && String(payload.new?.conversation_id||payload.old?.conversation_id||'')===String(state.selectedConversationId)){ await loadChatMessages(state.selectedConversationId,false); }
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: DB.notifications }, async payload => {
      await loadNotifications(); render();
      if(payload.eventType==='INSERT' && document.visibilityState==='visible') toast(payload.new?.title || 'Có thông báo mới');
    })
    .subscribe();
}

async function loadChatUnread(){
  state.chatUnread={}; if(!cloudMode||!state.chatMembers.length)return;
  const mine=state.chatMembers.filter(m=>String(m.user_id)===String(state.user?.id));
  if(!mine.length)return;
  const oldest=mine.map(m=>new Date(m.last_read_at||0).toISOString()).sort()[0];
  const {data,error}=await supabase.from(DB.chatMessages).select('id,conversation_id,sender_id,created_at,deleted_at').gt('created_at',oldest).limit(5000);
  if(error)return;
  const readMap=Object.fromEntries(mine.map(m=>[String(m.conversation_id),new Date(m.last_read_at||0).getTime()]));
  for(const x of data||[]){const k=String(x.conversation_id); if(String(x.sender_id)===String(state.user?.id))continue; if(new Date(x.created_at).getTime()>(readMap[k]||0))state.chatUnread[k]=(state.chatUnread[k]||0)+1;}
}

async function initPushClient(){

function holdExpired(room) { return room?.status === 'reserved' && room.hold_until && new Date(room.hold_until).getTime() < Date.now(); }
function holdLabel(room) {
  if (room?.status !== 'reserved' || !room.hold_until) return '';
  const when = formatDateTime(room.hold_until);
  return holdExpired(room) ? `Giữ/cọc đã quá hạn · ${when}` : `Giữ đến ${when}`;
}
function roomQuality(room) {
  const issues = [];
  if (!room.images?.length) issues.push('Thiếu hình ảnh');
  if (!room.public_note) issues.push('Thiếu mô tả gửi khách');
  if (!room.available_date) issues.push('Thiếu ngày vào ở');
  if (!room.electricity || !room.water) issues.push('Thiếu phí điện/nước');
  if (!room.furnishing) issues.push('Thiếu nội thất');
  return issues;
}
function areaStats() {
  const map = new Map();
  state.rooms.forEach(r => {
    const key = r.area || 'Chưa phân khu vực';
    if (!map.has(key)) map.set(key, { name:key, total:0, available:0, soon:0, reserved:0, rented:0, hidden:0 });
    const item = map.get(key); item.total++; if (item[r.status] != null) item[r.status]++; if (r.is_visible === false) item.hidden++;
  });
  return [...map.values()].sort((a,b) => b.available - a.available || a.name.localeCompare(b.name, 'vi'));
}
function roomEvents(roomId) {
  const room = getRoom(roomId); if (!room) return [];
  return state.activity.filter(a => String(a.room_id || '') === String(roomId) || (!a.room_id && a.room_code === room.code)).slice(0, 8);
}
function favoriteKey(id){ return String(id); }
function toggleFavorite(id) {
  const key = favoriteKey(id);
  if (state.favorites.has(key)) state.favorites.delete(key); else state.favorites.add(key);
  if (!cloudMode) demoSave(); else { try { localStorage.setItem(DEMO_FAVORITES_KEY, JSON.stringify([...state.favorites])); } catch {} }
  render();
}

function visibleRooms() {
  return state.rooms.filter(r => r.is_visible !== false);
}
function filteredRooms() {
  const q = normalizeText(state.filter.q);
  return state.rooms.filter(r => {
    if (!isAdmin() && r.is_visible === false) return false;
    if (isAdmin() && r.is_visible === false && !state.filter.showHidden) return false;
    if (isAdmin() && state.filter.onlyHidden && r.is_visible !== false) return false;
    const text = normalizeText(`${r.code} ${normalizeRoomCode(r.code)} ${projectName(r.project_id)} ${r.address} ${r.area} ${r.type} ${r.public_note} ${(r.amenities || []).map(a => AMENITY_MAP[a]?.label || a).join(' ')} ${(r.custom_amenities || []).map(a => `${a.icon || ''} ${a.label || ''}`).join(' ')} ${(r.custom_fields || []).map(f => `${f.label || ''} ${f.value || ''}`).join(' ')}`);
    const qOk = !q || text.includes(q);
    const statusOk = !state.filter.status || r.status === state.filter.status;
    const areaOk = !state.filter.area || r.area === state.filter.area;
    const typeOk = !state.filter.type || r.type === state.filter.type;
    const p = Number(r.price || 0);
    const priceOk = !state.filter.price || (
      state.filter.price === 'under5' ? p < 5_000_000 :
      state.filter.price === '5to7' ? p >= 5_000_000 && p < 7_000_000 :
      state.filter.price === '7to10' ? p >= 7_000_000 && p <= 10_000_000 : p > 10_000_000
    );
    return qOk && statusOk && areaOk && typeOk && priceOk;
  }).sort((a, b) => {
    if (state.filter.sort === 'priceAsc') return Number(a.price || 0) - Number(b.price || 0);
    if (state.filter.sort === 'priceDesc') return Number(b.price || 0) - Number(a.price || 0);
    if (state.filter.sort === 'code') return String(a.code || '').localeCompare(String(b.code || ''), 'vi');
    if (state.filter.sort === 'favorite') return Number(state.favorites.has(String(b.id))) - Number(state.favorites.has(String(a.id))) || new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at);
    return new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at);
  });
}
function counts() {
  const rooms = visibleRooms();
  return Object.fromEntries(Object.keys(STATUS).map(k => [k, rooms.filter(r => r.status === k).length]));
}

ss="dynamic-head"><div><label>🏠 Phòng trong dự án</label><small>Chọn các phòng hiện có để gắn vào dự án. Mã phòng có thể trùng nhau.</small></div></div><div class="project-room-checks">${state.rooms.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code),'vi')).map(r=>`<label><input type="checkbox" name="project_room_ids" value="${escapeAttr(r.id)}" ${attached.has(String(r.id))?'checked':''}/><span><b>${escapeHtml(r.code)}</b><small>${escapeHtml(r.area||'')} · ${money(r.price)}${r.project_id&&String(r.project_id)!==String(p?.id||'')?` · đang ở ${escapeHtml(projectName(r.project_id)||'dự án khác')}`:''}</small></span></label>`).join('')||'<div class="empty-inline">Chưa có phòng hiện có.</div>'}</div></section><div class="employee-editor-actions">${!isNew?`<button type="button" class="btn btn-danger" data-delete-project="${p.id}">Xóa dự án</button>`:''}<button type="button" class="btn btn-soft" id="cancelProjectEditor">Hủy</button><button class="btn btn-primary" type="submit">${isNew?'Tạo dự án':'Lưu dự án'}</button></div></form></div></div>`;

async function submitProject(e){
  e.preventDefault(); const form=e.currentTarget, fd=new FormData(form), isNew=state.projectEditor==='new'; const current=isNew?null:getProject(state.projectEditor); const btn=form.querySelector('button[type="submit"]');
  const project={name:String(fd.get('name')||'').trim(),area:String(fd.get('area')||'').trim(),address:String(fd.get('address')||'').trim(),owner_name:String(fd.get('owner_name')||'').trim(),manager_name:String(fd.get('manager_name')||'').trim(),phone:String(fd.get('phone')||'').trim(),description:String(fd.get('description')||'').trim(),amenities:String(fd.get('amenities')||'').split(',').map(x=>x.trim()).filter(Boolean),note:String(fd.get('note')||'').trim(),updated_at:nowIso()};
  if(!project.name){toast('Vui lòng nhập tên dự án');return;} btn.disabled=true;btn.textContent=isNew?'Đang tạo dự án...':'Đang lưu...';
  try{
    let id=current?.id;
    if(isNew){const data=await directFetch(`/rest/v1/${DB.projects}?select=id`,{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({...project,created_by:state.user.id,updated_by:state.user.id,images:[]})},15000);id=(Array.isArray(data)?data[0]:data)?.id;}else await directFetch(`/rest/v1/${DB.projects}?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({...project,updated_by:state.user.id})},15000);
    if(!id) throw new Error('Không tạo được dự án');
    const images=[...state.projectEditImages]; for(const file of state.pendingProjectImages.slice(0,Math.max(0,8-images.length))){const compressed=await compressImage(file);const path=`${state.user.id}/projects/${id}/${Date.now()}-${uuid()}.jpg`;images.push(await uploadImageDirect(compressed,path));}
    await directFetch(`/rest/v1/${DB.projects}?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({images:images.slice(0,8),updated_by:state.user.id})},15000);
    const selected=new Set([...form.querySelectorAll('[name="project_room_ids"]:checked')].map(x=>String(x.value)));
    const changes=[]; for(const r of state.rooms){const isHere=String(r.project_id||'')===String(id);const should=selected.has(String(r.id));if(should&&!isHere)changes.push(patchRoomDirect(r.id,{project_id:id,updated_by:state.user.id}));else if(isHere&&!should)changes.push(patchRoomDirect(r.id,{project_id:null,updated_by:state.user.id}));}
    await Promise.all(changes); state.projectEditor=null;state.projectEditImages=[];state.pendingProjectImages=[];state.selectedProjectId=id;state.roomViewMode='projects';await Promise.all([loadProjects(),loadRooms()]);render();toast(isNew?'Đã tạo dự án':'Đã cập nhật dự án');
  }catch(err){btn.disabled=false;btn.textContent=isNew?'Tạo dự án':'Lưu dự án';toast(err.message||'Không lưu được dự án');}
}

  try{await callEdgeFunction('admin-maintenance',{action:'delete_project',project_id:id});state.projectEditor=null;state.selectedProjectId=null;await Promise.all([loadProjects(),loadRooms()]);render();toast(`Đã xóa dự án ${p.name}. Các phòng được giữ lại.`);}catch(err){toast(err.message||'Không xóa được dự án');}

      ${rooms.length ? `<section class="room-grid">${rooms.map(roomCard).join('')}</section>` : emptyRooms()}
    </main>`;
}

function summaryCard(status, value) {
  const meta = STATUS[status];
  return `<button class="summary-card ${state.filter.status === status ? 'active' : ''}" data-status="${status}"><span class="status-dot ${meta.className}"></span><div><strong>${value}</strong><small>${meta.label}</small></div></button>`;
}

function emptyRooms() {
  return `<div class="empty"><div class="empty-icon">⌂</div><strong>Không có phòng phù hợp</strong><p>Thử đổi trạng thái hoặc xóa bộ lọc để xem thêm phòng.</p><button class="btn btn-soft" id="emptyReset">Xóa bộ lọc</button></div>`;
}

function roomCard(r) {
  const status = STATUS[r.status] || STATUS.available;
  const cover = r.images?.[0] || placeholderImage();
  return `
    <article class="card ${r.is_visible === false ? 'hidden-room' : ''}">
      <button class="cover" data-open-room="${r.id}" aria-label="Xem ${escapeAttr(r.code)}">

        <span class="badge ${status.className}">${status.icon} ${status.label}</span>
        ${r.area ? `<span class="card-area-badge">📍 ${escapeHtml(r.area)}</span>` : ''}
        ${r.is_visible === false ? '<span class="hidden-badge">Đang ẩn</span>' : ''}
        ${(r.images?.length || r.videos?.length) ? `<span class="photo-count">📷 ${r.images?.length || 0}${r.videos?.length ? ` · ▶ ${r.videos.length}` : ''}</span>` : ''}
      </button>
      <div class="card-body">
        <div class="card-topline"><div><div class="room-code">${escapeHtml(r.code)}</div></div><div class="room-card-tools"><button class="favorite-btn ${state.favorites.has(String(r.id)) ? 'active' : ''}" data-favorite-room="${r.id}" title="Đánh dấu phòng">★</button><button class="card-select ${state.selectedForShare.has(String(r.id)) ? 'active' : ''}" data-select-room="${r.id}">${state.selectedForShare.has(String(r.id)) ? '✓ Đã chọn' : '+ Chọn'}</button>${isAdmin() ? `<button class="more-btn" data-edit-room="${r.id}" title="Sửa phòng">•••</button>` : ''}</div></div>
        <div class="price price-featured">${money(r.price)}<span>/tháng</span></div>
        ${r.project_id ? `<div class="room-project-chip">🏢 ${escapeHtml(projectName(r.project_id) || 'Dự án')}</div>` : ''}
        <div class="address">📌 ${escapeHtml(r.address || '-')}</div>
        <div class="chips">${r.furnishing ? `<span>${escapeHtml(r.furnishing)}</span>` : '<span>Nội thất chưa cập nhật</span>'}</div>
        ${roomCardAmenityChips(r)}
        ${roomCardFees(r)}
        ${roomCardCustomFields(r)}
        <div class="availability">${r.status === 'reserved' && holdLabel(r) ? `<strong class="${holdExpired(r) ? 'overdue-text' : ''}">${escapeHtml(holdLabel(r))}</strong>` : `<strong>${escapeHtml(STATUS[r.status]?.label || 'Đang cập nhật')}</strong>`}</div>

          <button class="btn btn-soft" data-open-room="${r.id}">Xem phòng</button>

      </div>
    </article>`;
}

function roomCardAmenityChips(r) {
  const priority = ['balcony','elevator','washer','aircon','parking','freehours','window','kitchen','fridge','security','pet','rooftop'];
  const priorityRank = key => {
    const index = priority.indexOf(key);
    return index === -1 ? priority.length : index;
  };
  const standard = (r.amenities || []).map(key => ({ key, ...(AMENITY_MAP[key] || { icon:'✨', label:key }) }));
  standard.sort((a,b) => priorityRank(a.key) - priorityRank(b.key));
  const custom = (r.custom_amenities || []).filter(x => x?.label).map(x => ({ icon:x.icon || '✨', label:x.label }));
  const all = [...standard, ...custom];
  if (!all.length) return '<div class="card-amenities card-amenities-empty" aria-hidden="true">&nbsp;</div>';
  return `<div class="card-amenities" aria-label="Tiện ích phòng">${all.map(a => `<span><i>${escapeHtml(a.icon || '✨')}</i>${escapeHtml(a.label)}</span>`).join('')}</div>`;
}

function roomCardFees(r) {
  const fees = [
    ['⚡', 'Điện', r.electricity],
    ['💧', 'Nước', r.water],
    ['🛵', 'Xe', r.parking],
    ['🧾', 'Dịch vụ', r.service_fee]
  ];
  return `<div class="card-fees" aria-label="Chi phí phòng">${fees.map(([icon,label,value]) => value ? `<div><span>${icon} ${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>` : '<div class="card-fee-empty" aria-hidden="true">&nbsp;</div>').join('')}</div>`;
}

function roomCardCustomFields(r) {
  const fields = (r.custom_fields || []).filter(f => f?.label && f?.value);
  if (!fields.length) return '';
  return `<div class="card-extra-fields" aria-label="Thông tin bổ sung">${fields.map(f => `<div><span>${escapeHtml(f.icon || '•')} ${escapeHtml(f.label)}</span><strong>${escapeHtml(f.value)}</strong></div>`).join('')}</div>`;
}

function field(label, name, value = '', placeholder = '', required = false, type = 'text') {
  return `<div class="form-group"><label>${label}</label><input class="field" name="${name}" type="${type}" value="${escapeAttr(value ?? '')}" placeholder="${escapeAttr(placeholder)}" ${required ? 'required' : ''} /></div>`;
}

function quickOptionValues(key) {
  return [...new Set(state.quickOptions?.[key] || [])];
}
function quickField(label, name, value = '', placeholder = '', optionKey = '', roomField = '', required = false, type = 'text') {
  const listId = `quick-${name}-list`;
  const options = quickOptionValues(optionKey);
  return `<div class="form-group quick-form-group"><div class="field-label-row"><label>${label}</label><span class="field-option-actions"><button type="button" class="field-add-btn" data-add-option="${escapeAttr(optionKey)}" data-option-target="${escapeAttr(name)}" data-option-label="${escapeAttr(label.replace(/<[^>]*>/g,''))}">＋ Thêm</button><button type="button" class="field-delete-btn" data-delete-option="${escapeAttr(optionKey)}" data-option-target="${escapeAttr(name)}" title="Xóa lựa chọn đang nhập">Xóa</button></span></div><input class="field" name="${name}" type="${type}" list="${listId}" value="${escapeAttr(value ?? '')}" placeholder="${escapeAttr(placeholder)}" ${required ? 'required' : ''}/><datalist id="${listId}">${options.map(v => `<option value="${escapeAttr(v)}"></option>`).join('')}</datalist></div>`;
}
function persistQuickOptions() {
  try { localStorage.setItem(DEMO_OPTIONS_KEY, JSON.stringify(state.quickOptions)); } catch {}
  if (cloudMode && isAdmin()) {
    supabase.from(DB.appSettings).upsert({ id:'quick_options', value:state.quickOptions, updated_by:state.user.id, updated_at:nowIso() }).then(()=>{}).catch(()=>{});
  }
}
async function loadQuickOptionsCloud() {
  if (!cloudMode || !isAdmin()) return;
  const { data, error } = await supabase.from(DB.appSettings).select('value').eq('id','quick_options').maybeSingle();
  if (!error && data?.value && typeof data.value === 'object') state.quickOptions = { ...structuredClone(DEFAULT_QUICK_OPTIONS), ...data.value };
}
function rememberQuickOption(key, value) {
  const clean = String(value || '').trim();
  if (!key || !clean) return;
  if (!state.quickOptions[key]) state.quickOptions[key] = [];
  if (!state.quickOptions[key].some(v => normalizeText(v) === normalizeText(clean))) {
    state.quickOptions[key].push(clean);
    persistQuickOptions();
  }
}
function removeQuickOption(key, targetName) {
  const input = document.querySelector(`[name="${CSS.escape(targetName)}"]`);
  const value = String(input?.value || '').trim();
  if (!value) { toast('Nhập hoặc chọn giá trị cần xóa trước'); return; }
  const list = state.quickOptions[key] || [];
  const exists = list.some(v => normalizeText(v) === normalizeText(value));
  if (!exists) { toast('Giá trị này chưa nằm trong danh sách lưu nhanh'); return; }
  state.confirm = { title:`Xóa “${value}”?`, message:'Lựa chọn này sẽ bị xóa khỏi danh sách dùng nhanh. Dữ liệu đã lưu trong các phòng cũ không bị thay đổi.', actionLabel:'Xóa', onConfirm:()=>{
    state.quickOptions[key] = list.filter(v => normalizeText(v) !== normalizeText(value));
    persistQuickOptions();
    render(); toast('Đã xóa lựa chọn khỏi danh sách dùng nhanh');
  }};
  render();
}

function rememberRoomQuickOptions(room) {
  const pairs = [
    ['areas','area'], ['furnishing','furnishing'], ['deposits','deposit'],
    ['electricity','electricity'], ['water','water'], ['parking','parking'], ['serviceFees','service_fee']
  ];
  pairs.forEach(([key, fieldName]) => rememberQuickOption(key, room?.[fieldName]));
}

function employeeSelectField(name, selectedId = '', required = false, label = '👤 Nhân viên phụ trách') {
  const selected = String(selectedId || '');
  const employees = state.employees.filter(e => e.active !== false || String(e.id) === selected).sort((a,b) => {
    if ((a.role === 'employee') !== (b.role === 'employee')) return a.role === 'employee' ? -1 : 1;
    return String(a.full_name || '').localeCompare(String(b.full_name || ''), 'vi');
  });
  const options = employees.map(e => `<option value="${escapeAttr(e.id)}" ${String(e.id) === selected ? 'selected' : ''}>${escapeHtml(e.full_name || 'Nhân viên')}${e.role === 'admin' ? ' · Quản lý' : ''}${e.active === false ? ' · Đã khóa' : ''}</option>`).join('');
  return `<div class="form-group"><label>${label}${required ? ' *' : ''}</label><select class="field" name="${name}" ${required ? 'required' : ''}><option value="">Chọn nhân viên</option>${options}</select></div>`;
}
function employeeNameById(id) {
  return state.employees.find(e => String(e.id) === String(id || ''))?.full_name || '';
}
function roomEmployeeSelect(r) {
  const selected=String(r?.assigned_employee_id||'');
  const employees=state.employees.filter(e=>e.active!==false || String(e.id)===selected).sort((a,b)=>{
    if((a.role==='employee')!==(b.role==='employee')) return a.role==='employee'?-1:1;
    return String(a.full_name||'').localeCompare(String(b.full_name||''),'vi');
  });
  return `<select class="field compact room-employee-select" data-room-employee="${escapeAttr(r.id)}" aria-label="Nhân viên phụ trách phòng"><option value="">👤 Chọn nhân viên (không bắt buộc)</option>${employees.map(e=>`<option value="${escapeAttr(e.id)}" ${String(e.id)===selected?'selected':''}>👤 ${escapeHtml(e.full_name||'Nhân viên')}${e.role==='admin'?' · Quản lý':''}</option>`).join('')}</select>`;
}
function customAmenityRow(item = {}) {
  return `<div class="dynamic-row amenity-custom-row" data-custom-amenity-row><input class="field icon-field" name="custom_amenity_icon" value="${escapeAttr(item.icon || '✨')}" maxlength="8" aria-label="Icon tiện ích"/><input class="field" name="custom_amenity_label" value="${escapeAttr(item.label || '')}" placeholder="Tên tiện ích, ví dụ Wifi riêng"/><button type="button" class="dynamic-remove" data-remove-dynamic aria-label="Xóa tiện ích">×</button></div>`;

function customFieldRow(item = {}) {

function collectCustomAmenities(form) {

function collectCustomFields(form) {

function adminOverviewView() {
  const rooms = state.rooms;
  const statusCounts = Object.fromEntries(Object.keys(STATUS).map(k => [k, rooms.filter(r => r.status === k).length]));
  const total = rooms.length;
  const hidden = rooms.filter(r => r.is_visible === false).length;
  const overdue = rooms.filter(holdExpired);
  const quality = rooms.map(r => ({ r, issues: roomQuality(r) })).filter(x => x.issues.length);
  const completeRooms = Math.max(0, total - quality.length);
  const dataQualityRate = total ? Math.round(completeRooms / total * 100) : 100;
  const visibleRate = total ? Math.round((total - hidden) / total * 100) : 0;
  const occupancyRate = total ? Math.round((statusCounts.rented || 0) / total * 100) : 0;
  const readyCount = (statusCounts.available || 0) + (statusCounts.soon || 0);
  const readyRate = total ? Math.round(readyCount / total * 100) : 0;
  const avgPrice = total ? Math.round(rooms.reduce((sum,r)=>sum+Number(r.price||0),0) / total) : 0;

  const customerCounts = Object.fromEntries(Object.keys(CUSTOMER_STATUS).map(k => [k, state.customers.filter(c => c.status === k).length]));
  const activeLeads = ['new','contacted','viewing','deposit'].reduce((sum,k)=>sum+(customerCounts[k]||0),0);
  const closedLeads = (customerCounts.won||0) + (customerCounts.lost||0);
  const closeRate = closedLeads ? Math.round((customerCounts.won||0) / closedLeads * 100) : 0;

  const activeEmployees = state.employees.filter(e => e.active !== false);
  const activeSales = activeEmployees.filter(e => e.role === 'employee').length;
  const activeAdmins = activeEmployees.filter(e => e.role === 'admin').length;
  const lockedEmployees = state.employees.length - activeEmployees.length;

  const areaRows = areaStats().map(a => {
    const list = rooms.filter(r => (r.area || 'Chưa phân khu vực') === a.name);
    const avg = list.length ? Math.round(list.reduce((sum,r)=>sum+Number(r.price||0),0)/list.length) : 0;
    const rented = list.filter(r=>r.status==='rented').length;
    return { ...a, avg, rented };
  });
  const maxAreaTotal = Math.max(1, ...areaRows.map(a=>a.total));

  const employeeRows = activeEmployees.map(e => ({
    e,
    customers: employeeCustomerCount(e),
    holds: rooms.filter(r => r.status === 'reserved' && String(r.hold_assigned_employee_id || '') === String(e.id)).length
  })).sort((a,b) => (b.holds + b.customers) - (a.holds + a.customers)).slice(0,8);
  const maxWork = Math.max(1, ...employeeRows.map(x=>x.holds+x.customers));

  const priceBands = [
    {label:'Dưới 5 triệu', value:rooms.filter(r=>Number(r.price||0)<5_000_000).length},
    {label:'5 - dưới 7 triệu', value:rooms.filter(r=>Number(r.price||0)>=5_000_000&&Number(r.price||0)<7_000_000).length},
    {label:'7 - 10 triệu', value:rooms.filter(r=>Number(r.price||0)>=7_000_000&&Number(r.price||0)<=10_000_000).length},
    {label:'Trên 10 triệu', value:rooms.filter(r=>Number(r.price||0)>10_000_000).length}
  ];
  const maxPriceBand = Math.max(1, ...priceBands.map(x=>x.value));

  const healthScore = Math.round((dataQualityRate * .45) + (visibleRate * .25) + (Math.max(0,100-Math.min(100,overdue.length*20)) * .15) + (Math.max(0,100-Math.min(100,hidden*10)) * .15));

  return `
    <section class="dashboard-hero">
      <div class="dashboard-hero-main"><span>CRM - EZHOUSE</span><h2>Vận hành kho phòng & đội sale</h2><p>Nhìn nhanh nguồn phòng, khách đang tư vấn, giữ/cọc, chất lượng dữ liệu và hiệu suất phân công.</p><div class="dashboard-hero-tags"><b>🟢 ${readyCount} phòng có thể tư vấn</b><b>👥 ${activeLeads} khách đang theo dõi</b></div></div>
      <div class="health-ring" style="--score:${healthScore}"><div><strong>${healthScore}</strong><span>/100</span><small>Sức khỏe dữ liệu</small></div></div>
    </section>

    <section class="dashboard-kpis">
      <button data-report-status=""><span class="kpi-icon">🏠</span><div><small>Tổng kho</small><strong>${total}</strong><em>${hidden} phòng đang ẩn</em></div></button>
      <button data-report-status="available"><span class="kpi-icon">🟢</span><div><small>Trống ngay</small><strong>${statusCounts.available || 0}</strong><em>${readyRate}% kho sẵn sàng</em></div></button>
      <button data-report-status="reserved"><span class="kpi-icon">🟣</span><div><small>Giữ / cọc</small><strong>${statusCounts.reserved || 0}</strong><em class="${overdue.length?'danger-text':''}">${overdue.length} quá hạn</em></div></button>
      <button data-report-status="rented"><span class="kpi-icon">⚫</span><div><small>Đang thuê</small><strong>${statusCounts.rented || 0}</strong><em>${occupancyRate}% tỷ lệ lấp đầy</em></div></button>
      <button data-admin-tab-jump="customers"><span class="kpi-icon">👥</span><div><small>Khách đang theo dõi</small><strong>${activeLeads}</strong><em>${closeRate}% tỷ lệ chốt đã đóng</em></div></button>
      <button data-admin-tab-jump="employees"><span class="kpi-icon">🪪</span><div><small>Nhân sự hoạt động</small><strong>${activeEmployees.length}</strong><em>${activeSales} sale · ${activeAdmins} quản lý</em></div></button>
      <button data-report-quality="1"><span class="kpi-icon">✅</span><div><small>Dữ liệu đầy đủ</small><strong>${dataQualityRate}%</strong><em>${quality.length} phòng cần bổ sung</em></div></button>
    </section>

    <div class="dashboard-grid dashboard-grid-main">
      <section class="panel dashboard-panel">
        <div class="panel-heading"><div><strong>Trạng thái kho phòng</strong><span>Phân bổ toàn bộ nguồn hàng hiện tại</span></div><span class="metric-pill">Giá TB ${money(avgPrice)}</span></div>
        <div class="status-report-list">
          ${[['available','Trống ngay'],['soon','Sắp trống'],['reserved','Giữ / cọc'],['rented','Đang thuê']].map(([k,label])=>{const value=statusCounts[k]||0;const pct=total?Math.round(value/total*100):0;return `<button data-report-status="${k}"><div><span>${escapeHtml(label)}</span><strong>${value}</strong><small>${pct}%</small></div><i><b class="bar-${k}" style="width:${pct}%"></b></i></button>`}).join('')}
        </div>
        <div class="mini-metrics"><div><span>Sale nhìn thấy</span><strong>${visibleRate}%</strong></div><div><span>Sẵn sàng tư vấn</span><strong>${readyRate}%</strong></div><div><span>Đang thuê</span><strong>${occupancyRate}%</strong></div><div><span>Thiếu dữ liệu</span><strong>${quality.length}</strong></div></div>
      </section>

      <section class="panel dashboard-panel">
        <div class="panel-heading"><div><strong>Phễu khách hàng</strong><span>Từ khách mới đến khách thuê</span></div><button class="text-link" data-admin-tab-jump="customers">Mở CRM →</button></div>
        <div class="funnel-modern">${Object.entries(CUSTOMER_STATUS).map(([k,label],idx)=>{const val=customerCounts[k]||0;const max=Math.max(1,state.customers.length);return `<div><span><b>${escapeHtml(label)}</b><em>${val}</em></span><i><b style="width:${Math.max(4,Math.round(val/max*100))}%"></b></i></div>`}).join('')}</div>
        <div class="mini-metrics"><div><span>Tổng khách</span><strong>${state.customers.length}</strong></div><div><span>Đang chăm sóc</span><strong>${activeLeads}</strong></div><div><span>Đã thuê</span><strong>${customerCounts.won||0}</strong></div><div><span>Tỷ lệ chốt</span><strong>${closeRate}%</strong></div></div>
      </section>
    </div>

    <div class="dashboard-grid dashboard-grid-main">
      <section class="panel dashboard-panel">
        <div class="panel-heading"><div><strong>Khu vực</strong><span>Số lượng phòng, trạng thái và giá trung bình</span></div></div>
        <div class="area-bars">${areaRows.map(a=>`<button data-area-open="${escapeAttr(a.name)}"><div class="area-bar-title"><strong>${escapeHtml(a.name)}</strong><span>${a.total} phòng · TB ${money(a.avg)}</span></div><i><b style="width:${Math.max(8,Math.round(a.total/maxAreaTotal*100))}%"></b></i><small><span>🟢 ${a.available} trống</span><span>🟣 ${a.reserved} giữ</span><span>⚫ ${a.rented} thuê</span></small></button>`).join('') || '<div class="empty-inline">Chưa có dữ liệu khu vực.</div>'}</div>
      </section>

      <section class="panel dashboard-panel">
        <div class="panel-heading"><div><strong>Nhân viên phụ trách</strong><span>Khách hàng + phòng đang giữ/cọc</span></div><button class="text-link" data-admin-tab-jump="employees">Nhân viên →</button></div>
        <div class="workload-modern">${employeeRows.map(x=>{const totalWork=x.customers+x.holds;return `<div><div class="employee-avatar small-avatar">${initials(x.e.full_name)}</div><p><strong>${escapeHtml(x.e.full_name)}</strong><small>${x.e.role==='admin'?'Quản lý':'Sale'} · ${x.customers} khách · ${x.holds} giữ/cọc</small><i><b style="width:${Math.max(4,Math.round(totalWork/maxWork*100))}%"></b></i></p><strong>${totalWork}</strong></div>`}).join('') || '<div class="empty-inline">Chưa có nhân viên hoạt động.</div>'}</div>
      </section>
    </div>

    <div class="dashboard-grid dashboard-grid-main">
      <section class="panel dashboard-panel">
        <div class="panel-heading"><div><strong>Kho theo khoảng giá</strong><span>Giúp sale nhìn nhanh phân khúc đang có nguồn</span></div></div>
        <div class="price-band-list">${priceBands.map(x=>`<div><span><b>${escapeHtml(x.label)}</b><em>${x.value} phòng</em></span><i><b style="width:${Math.max(4,Math.round(x.value/maxPriceBand*100))}%"></b></i></div>`).join('')}</div>
      </section>
      <section class="panel dashboard-panel">
        <div class="panel-heading"><div><strong>Việc cần xử lý</strong><span>Cảnh báo ưu tiên trước khi sale tư vấn</span></div></div>
        <div class="task-list compact-tasks">${overdue.map(r=>adminTask(r,'Giữ/cọc đã quá hạn',`${holdLabel(r)}${r.hold_assigned_employee_id ? ` · ${employeeNameById(r.hold_assigned_employee_id)}` : ''}`,'danger')).join('')}${quality.slice(0,6).map(({r,issues})=>adminTask(r,`${issues.length} mục chưa đủ`,issues.join(' · '),'warning')).join('') || (!overdue.length && !quality.length ? '<div class="empty-inline">Kho phòng đang đầy đủ, chưa có cảnh báo.</div>' : '')}</div>
      </section>
    </div>
`;
}

function backupAdminView() {

function filteredEmployees() {
  const q = normalizeText(state.employeeFilter.q || '');
  return state.employees.filter(e => {
    if (state.employeeFilter.role && e.role !== state.employeeFilter.role) return false;
    if (state.employeeFilter.status === 'active' && e.active === false) return false;
    if (state.employeeFilter.status === 'locked' && e.active !== false) return false;
    if (q && !normalizeText(`${e.full_name || ''} ${e.email || ''} ${e.phone || ''} ${e.zalo || ''} ${e.address || ''} ${e.cccd || ''}`).includes(q)) return false;
    return true;
  }).sort((a,b) => (a.active === false) - (b.active === false) || (a.role === b.role ? 0 : a.role === 'admin' ? -1 : 1) || String(a.full_name).localeCompare(String(b.full_name),'vi'));
}
function employeeCustomerCount(e) {
  return state.customers.filter(c => String(c.assigned_employee_id || '') === String(e.id) || (!c.assigned_employee_id && normalizeText(c.assigned_name || '') === normalizeText(e.full_name || ''))).length;
}
function reportLocalKey(value, mode='day') {
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '';
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return mode==='month' ? `${y}-${m}` : `${y}-${m}-${day}`;
}
function employeeRevenuePeriodRows() {
  const p=state.employeeReportPeriod || {};
  const key=p.mode==='day' ? p.day : p.month;
  return (state.employeeRevenue||[]).filter(x=>reportLocalKey(x.rented_at,p.mode)===(key||''));
}
function employeeReportStats(e, periodRows=employeeRevenuePeriodRows()) {
  const id=String(e.id||'');
  const assignedRooms=state.rooms.filter(r=>String(r.assigned_employee_id||'')===id);
  const customers=state.customers.filter(c=>String(c.assigned_employee_id||'')===id || (!c.assigned_employee_id && normalizeText(c.assigned_name||'')===normalizeText(e.full_name||'')));
  const holds=state.rooms.filter(r=>r.status==='reserved' && (String(r.assigned_employee_id||'')===id || String(r.hold_assigned_employee_id||'')===id)).length;
  const currentRented=assignedRooms.filter(r=>r.status==='rented').length;
  const rows=periodRows.filter(x=>String(x.employee_id||'')===id || (!x.employee_id && normalizeText(x.employee_name||'')===normalizeText(e.full_name||'')));
  const revenue=rows.reduce((sum,x)=>sum+Number(x.amount||0),0);
  const closeRate=assignedRooms.length ? Math.min(100,Math.round(currentRented/assignedRooms.length*100)) : 0;
  return { rooms:assignedRooms.length, customers:customers.length, holds, rented:rows.length, currentRented, revenue, closeRate, rows };
}
function employeeReportPanel() {
  const periodRows=employeeRevenuePeriodRows();
  const employees=state.employees.filter(e=>e.role==='employee').sort((a,b)=>String(a.full_name||'').localeCompare(String(b.full_name||''),'vi'));
  const orphanNames=[...new Set(periodRows.filter(x=>!x.employee_id && x.employee_name).map(x=>x.employee_name))];
  const reportPeople=[
    ...employees.map(e=>({e,stats:employeeReportStats(e,periodRows)})),

  ].sort((a,b)=>b.stats.revenue-a.stats.revenue || b.stats.rented-a.stats.rented || String(a.e.full_name||'').localeCompare(String(b.e.full_name||''),'vi'));

  const periodLabel=p.mode==='day' ? `Ngày ${p.day?.split('-').reverse().join('/')||''}` : `Tháng ${p.month?.split('-').reverse().join('/')||''}`;
  return `<section class="panel employee-report-panel">

      </div>
    </div>
    <div class="employee-report-summary">
      <div class="revenue"><span>💰 Doanh thu</span><strong>${money(totalRevenue)}</strong><small>${escapeHtml(periodLabel)}</small></div>
      <div><span>🏠 Phòng đã thuê</span><strong>${rentedCount}</strong><small>Giao dịch trong kỳ</small></div>
      <div><span>👥 Có doanh thu</span><strong>${earners}</strong><small>${employees.length} nhân viên</small></div>
      <div><span>📈 Giá trị TB</span><strong>${money(avg)}</strong><small>/ phòng đã thuê</small></div>
    </div>
    <div class="employee-report-table-wrap">
      <table class="employee-report-table">
        <thead><tr><th>Nhân viên</th><th>Doanh thu</th><th>Đã thuê</th><th>Giữ/cọc</th><th>Khách</th><th>Phòng phụ trách</th><th>Tỷ lệ chốt</th><th></th></tr></thead>
        <tbody>${reportPeople.map(({e,stats},idx)=>`<tr class="${String(state.employeeReportId||'')===String(e.id)?'active':''}" data-employee-report="${escapeAttr(e.id)}"><td><div class="report-person"><span class="employee-report-avatar">${initials(e.full_name)}</span><div><strong>${escapeHtml(e.full_name||'Nhân viên')}</strong><small>${e.active===false?'Đã khóa / dữ liệu lịch sử':'Đang hoạt động'} · #${idx+1}</small></div></div></td><td class="report-money"><strong>${money(stats.revenue)}</strong></td><td><b>${stats.rented}</b></td><td>${stats.holds}</td><td>${stats.customers}</td><td>${stats.rooms}</td><td><b>${stats.closeRate}%</b></td><td><button class="report-detail-btn" type="button">Xem</button></td></tr>`).join('')||`<tr><td colspan="8"><div class="empty-inline">Chưa có nhân viên để báo cáo.</div></td></tr>`}</tbody>
      </table>
    </div>
    ${selectedRow ? `<div class="employee-report-detail">
      <div class="employee-report-selected"><span class="employee-avatar">${initials(selectedRow.e.full_name)}</span><div><small>CHI TIẾT ${escapeHtml(periodLabel.toUpperCase())}</small><strong>${escapeHtml(selectedRow.e.full_name||'Nhân viên')}</strong><span>${selectedRow.stats.rented} phòng · ${money(selectedRow.stats.revenue)}</span></div><button class="employee-report-close" data-employee-report-close>×</button></div>

function unicodeBold(value = '') {
  const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const lower = 'abcdefghijklmnopqrstuvwxyz';
  const digits = '0123456789';
  const mapChar = ch => {
    let i = upper.indexOf(ch); if (i >= 0) return String.fromCodePoint(0x1D400 + i);
    i = lower.indexOf(ch); if (i >= 0) return String.fromCodePoint(0x1D41A + i);
    i = digits.indexOf(ch); if (i >= 0) return String.fromCodePoint(0x1D7CE + i);
    return ch;
  };
  return String(value).normalize('NFD').split('').map(mapChar).join('').normalize('NFC');
}
function splitCopyLabel(text = '') {
  const i = String(text).indexOf(':');
  if (i < 0) return { label:'', value:String(text) };
  return { label:String(text).slice(0, i + 1), value:String(text).slice(i + 1) };
}

async function copyRichContent(text, html) {
  if (navigator.clipboard?.write && typeof ClipboardItem !== 'undefined' && window.isSecureContext) {
    try {
      const item = new ClipboardItem({
        'text/plain': new Blob([text], { type: 'text/plain' }),
        'text/html': new Blob([html], { type: 'text/html' })
      });
      await navigator.clipboard.write([item]);
      return true;
    } catch {}
  }
  try { await navigator.clipboard.writeText(text); return true; }
  catch { fallbackCopy(text); return false; }
}
function initials(name = '') { return escapeHtml(name.split(/\s+/).filter(Boolean).slice(-2).map(x => x[0]).join('').toUpperCase() || 'NV'); }
function placeholderImage() { return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="100%" height="100%" fill="#eef1f5"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#9aa3af" font-family="Arial" font-size="44">Chưa có hình phòng</text></svg>`); }
function openMediaDb() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('Trình duyệt không hỗ trợ lưu video local'));
    const req = indexedDB.open('ezhouse-media-v1', 1);
    req.onupgradeneeded = () => { const db=req.result; if(!db.objectStoreNames.contains('media')) db.createObjectStore('media'); };
    req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
  });
}
async function storeLocalVideo(file) {
  const key = `idb:${uuid()}`; const db = await openMediaDb();
  await new Promise((resolve,reject)=>{ const tx=db.transaction('media','readwrite'); tx.objectStore('media').put(file,key); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); });
  db.close(); return key;
}
async function removeLocalVideo(ref) {
  if (!String(ref||'').startsWith('idb:')) return;
  try { const db=await openMediaDb(); await new Promise((resolve,reject)=>{ const tx=db.transaction('media','readwrite'); tx.objectStore('media').delete(ref); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); }); db.close(); } catch {}
  const url=state.localVideoUrls.get(ref); if(url){ URL.revokeObjectURL(url); state.localVideoUrls.delete(ref); }
}
async function resolveLocalVideo(ref) {
  if (!String(ref||'').startsWith('idb:')) return ref || '';
  if (state.localVideoUrls.has(ref)) return state.localVideoUrls.get(ref);
  try { const db=await openMediaDb(); const blob=await new Promise((resolve,reject)=>{ const tx=db.transaction('media','readonly'); const req=tx.objectStore('media').get(ref); req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); }); db.close(); if(!blob)return ''; const url=URL.createObjectURL(blob); state.localVideoUrls.set(ref,url); return url; } catch { return ''; }
}
function videoSrc(ref) { return state.localVideoUrls.get(ref) || (!String(ref||'').startsWith('idb:') ? ref || '' : ''); }
async function ensureRoomVideos(room) { if(!room?.videos?.length)return; await Promise.all(room.videos.map(resolveLocalVideo)); }
function roomMedia(room) {
  const images=(room?.images?.length?room.images:[placeholderImage()]).map(src=>({type:'image',src}));
  const videos=(room?.videos||[]).map(src=>({type:'video',src:videoSrc(src)})).filter(x=>x.src);
  return [...images,...videos];
}
async function uploadVideoCloud(file) {
  const accessToken = await currentAccessToken();
  if (!accessToken) throw new Error('Phiên đăng nhập đã hết hạn');
  const projectId = new URL(supabaseUrl).hostname.split('.')[0];
  const ext = (file.name.split('.').pop() || 'mp4').replace(/[^a-z0-9]/gi,'').toLowerCase() || 'mp4';
  const path = `${state.user.id}/${Date.now()}-${uuid()}.${ext}`;
  await new Promise((resolve,reject)=>{
    const upload = new tus.Upload(file, {
      endpoint:`https://${projectId}.storage.supabase.co/storage/v1/upload/resumable`,
      retryDelays:[0,3000,5000,10000,20000],
      headers:{ authorization:`Bearer ${accessToken}`, apikey:supabasePublishableKey },
      uploadDataDuringCreation:true, removeFingerprintOnSuccess:true, chunkSize:6*1024*1024,
      metadata:{ bucketName:VIDEO_BUCKET, objectName:path, contentType:file.type || 'video/mp4', cacheControl:'3600' },
      onError:reject, onSuccess:resolve
    });
    upload.findPreviousUploads().then(prev=>{ if(prev.length) upload.resumeFromPreviousUpload(prev[0]); upload.start(); }).catch(reject);
  });
  return supabase.storage.from(VIDEO_BUCKET).getPublicUrl(path).data.publicUrl;
}

function phoneDigits(v=''){ return String(v || '').replace(/\D+/g,''); }
function openPhoneLink(v=''){ const digits = phoneDigits(v); if(!digits){ toast('Chưa có số điện thoại'); return; } window.open(`tel:${digits}`, '_self'); }
function openZaloLink(v=''){ const digits = phoneDigits(v); if(!digits){ toast('Chưa có Zalo'); return; } window.open(`https://zalo.me/${digits}`, '_blank'); }

function render() {
  const root = document.querySelector('#app');
  if (state.publicShareToken) { root.innerHTML = publicShareView(); bindPublicShare(); return; }
  if (!state.profile) { root.innerHTML = loginView(); bind(); return; }
  let content;
  if (state.view === 'overview' && isAdmin()) content = overviewPageView();
  else if (state.view === 'editor') content = editorView();
  else if (state.view === 'customers' && isAdmin()) content = customerPageView();
  else if (state.view === 'employees' && isAdmin()) content = employeePageView();
  else if (state.view === 'chat') content = chatView();
  else if (state.view === 'people') content = peopleView();
  else if (state.view === 'activity' && !isAdmin()) content = employeeUpdatesView();
  else content = roomsView();
  root.innerHTML = shell(content);
  bind();
}

  });
  const demoLoginForm = document.querySelector('#demoLoginForm');

    e.preventDefault();
    const fd = new FormData(demoLoginForm);
    const email = String(fd.get('email') || '').trim().toLowerCase();
    const password = String(fd.get('password') || '');
    const employee = state.employees.find(x => String(x.email || '').toLowerCase() === email);
    if (!employee || password !== (employee.demo_password || DEMO_DEFAULT_PASSWORD)) { toast('Sai email hoặc mật khẩu'); return; }
    if (employee.active === false) { toast('Tài khoản này đang bị khóa'); return; }
    state.user = { id: employee.id, email: employee.email };
    state.profile = { ...employee };
    const remember = fd.get('remember') === 'on';
    try {
      localStorage.removeItem(DEMO_SESSION_KEY); sessionStorage.removeItem(DEMO_SESSION_KEY);
      (remember ? localStorage : sessionStorage).setItem(DEMO_SESSION_KEY, employee.id);
    } catch {}
    state.view = employee.role === 'admin' ? 'overview' : 'rooms'; state.adminTab = 'activity'; state.filter.status = 'available';

  };

    button.disabled = true; button.textContent = 'Đang đăng nhập...';
    const remember = fd.get('remember') === 'on';
    try {
      localStorage.setItem(REMEMBER_LOGIN_KEY, remember ? '1' : '0');
      if (remember) sessionStorage.removeItem(REMEMBER_LOGIN_KEY); else sessionStorage.setItem(REMEMBER_LOGIN_KEY, 'session');
    } catch {}
    const { data, error } = await supabase.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
    if (error) { button.disabled = false; button.textContent = 'Đăng nhập'; toast('Sai email hoặc mật khẩu'); }
    else { state.accessToken = data?.session?.access_token || state.accessToken || ''; }
  };

    if (cloudMode) {
      const token = state.accessToken || '';
      // Đăng xuất UI ngay, không chờ Auth SDK lock/network.
      state.accessToken = '';
      state.user = null; state.profile = null; state.rooms = []; state.employees = []; state.activity = []; state.customers = []; state.shares = []; state.employeeRevenue = []; state.projects = []; state.chatDirectory=[]; state.chatConversations=[]; state.chatMembers=[]; state.chatMessages=[]; state.chatUnread={}; state.selectedConversationId=null; state.notifications=[]; state.notificationModal=false; state.pushSubscription=null;
      state.selectedRoom = null; state.reservationRoom = null; state.employeeEditor = null; state.customerEditor = null; state.mediaFullscreen = false;
      state.view = 'rooms';
      try {
        localStorage.removeItem(REMEMBER_LOGIN_KEY); sessionStorage.removeItem(REMEMBER_LOGIN_KEY);
        const authPrefix = 'sb-ezhhffnkqxscqrmjgbdg';
        for (const storage of [localStorage, sessionStorage]) {
          const keys=[]; for (let i=0;i<storage.length;i++) { const k=storage.key(i); if(k&&k.startsWith(authPrefix)) keys.push(k); }
          keys.forEach(k=>storage.removeItem(k));
        }
      } catch {}
      try { supabase.auth.stopAutoRefresh?.(); } catch {}
      if (state.realtimeChannel) { try { supabase.removeChannel(state.realtimeChannel); } catch {} state.realtimeChannel = null; }
      if (state.chatPresenceChannel) { try { supabase.removeChannel(state.chatPresenceChannel); } catch {} state.chatPresenceChannel = null; state.chatOnline=new Set(); }
      render();
      // Thu hồi session hiện tại ở Supabase chạy nền; không được phép làm UI bị treo.
      Promise.race([
        supabase.auth.signOut({ scope:'local' }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('signout timeout')), 5000))
      ]).catch(err => console.warn('EZHouse signOut background:', err));
      // Nếu SDK đang giữ access token cũ, gọi endpoint logout trực tiếp thêm một lần (best effort).
      if (token) fetch(`${supabaseUrl}/auth/v1/logout?scope=local`, {
        method:'POST', cache:'no-store',
        headers:{ 'Authorization':`Bearer ${token}`, 'apikey':supabasePublishableKey }
      }).catch(()=>{});
    } else {
      try { localStorage.removeItem(DEMO_SESSION_KEY); sessionStorage.removeItem(DEMO_SESSION_KEY); } catch {}

function aiPriceNumber(value='') {

  let m=raw.match(/(\d{1,3})(?:[.,](\d{1,2}))?\s*(?:trieu|tr)(?!\w)/); if(m)return Math.round((Number(m[1])+Number('0.'+(m[2]||'0')))*1_000_000);

}
function aiLabeledValue(lines, labels) {

    const norm=normalizeText(original).trim();
    for(const label of labelNorm){
      if(!(norm.startsWith(label+' ') || norm.startsWith(label+':') || norm.startsWith(label+'-') || norm===label)) continue;
      const rawLabelLen=label.length;
      const tail=original.trim().slice(rawLabelLen).replace(/^\s*[:=\-–—|]+\s*/,'').trim();
      if(tail)return tail;
    }
  }
  return '';
}
function aiSegmentValue(raw='', labels=[]) {
  const segments=String(raw).split(/[,;\n]+|[.](?=\s*[A-Za-zÀ-ỹ])/u).map(x=>x.trim()).filter(Boolean);
  const normalizedLabels=labels.map(normalizeText);
  for(const seg of segments){
    const n=normalizeText(seg);
    for(const label of normalizedLabels){
      const idx=n.indexOf(label); if(idx<0) continue;
      const after=seg.slice(Math.min(seg.length,idx+label.length)).replace(/^\s*[:=\-–—|]+\s*/,'').trim();
      if(after)return after;
    }
  }
  return '';
}

function aiMoneyCandidates(raw='') {
  const out=[]; const patterns=[
    /\b\d{1,2}(?:[.,]\d{1,2})?\s*(?:triệu|tr)\b/giu,
    /\b\d{1,2}\s*tr\s*\d{1,3}\b/giu,
    /\b\d{3,5}\s*k\b/giu,
    /\b\d{1,3}(?:[. ]\d{3}){1,2}\s*(?:đ|vnd)?\b/giu

  for(const re of patterns)for(const m of raw.matchAll(re)){const value=aiPriceNumber(m[0]);if(value)out.push({text:m[0],value,index:m.index||0});}
  return out;
}
function aiGuessRent(raw='', normalized='') {
  const labeled=raw.match(/(?:giá|gia|giá thuê|gia thue|rent)\s*[:=\-]?\s*([^\n;|]+)/i); if(labeled){const v=aiPriceNumber(labeled[1]);if(v>=1_000_000)return v;}
  const c=aiMoneyCandidates(raw).filter(x=>x.value>=1_000_000 && x.value<=100_000_000);
  if(!c.length)return 0;
  c.sort((a,b)=>b.value-a.value); return c[0].value;
}
function aiGuessAddress(lines, raw='') {
  const labeled=aiLabeledValue(lines,['địa chỉ','dia chi','address','dc','d/c']); if(labeled)return labeled;
  const text=String(raw||lines.join(' '));

function parseAndFillRoomForm(){

async function promiseTimeout(promise, ms, message='Thao tác quá thời gian chờ') {
  let timer;
  try { return await Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(message)),ms);})]); }
  finally { if(timer) clearTimeout(timer); }
}
async function currentAccessToken() {
  if (state.accessToken) return state.accessToken;
  const result = await promiseTimeout(supabase.auth.getSession(),5000,'Không lấy được phiên đăng nhập. Hãy tải lại trang rồi thử lại.');
  const token = result?.data?.session?.access_token || '';
  if (!token) throw new Error('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.');
  state.accessToken = token; return token;
}
async function directFetch(path, options={}, timeoutMs=15000) {
  const token = await currentAccessToken();
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(),timeoutMs);
  try {
    const response = await fetch(`${supabaseUrl}${path}`, {
      ...options,
      cache:'no-store',
      headers:{ 'Authorization':`Bearer ${token}`, 'apikey':supabasePublishableKey, ...(options.headers||{}) },
      signal:controller.signal
    });
    const raw = await response.text();
    let data = null; try { data = raw ? JSON.parse(raw) : null; } catch { data = raw; }
    if (response.status===401) { state.accessToken=''; throw new Error('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.'); }
    if (!response.ok) {
      const msg = (data && typeof data==='object' && (data.message||data.error||data.msg)) || (typeof data==='string'&&data) || `Máy chủ trả lỗi ${response.status}`;
      throw new Error(msg);
    }
    return data;
  } catch(err) {
    if (err?.name==='AbortError') throw new Error('Kết nối máy chủ quá lâu. Vui lòng thử lại.');
    if (/Failed to fetch|NetworkError|Load failed/i.test(String(err?.message||''))) throw new Error('Không kết nối được máy chủ. Hãy kiểm tra mạng và thử lại.');
    throw err;
  } finally { clearTimeout(timer); }
}

    const raw=await response.text(); let data={}; try{data=raw?JSON.parse(raw):{}}catch{data={error:raw||''}}
    if(response.status===401){state.accessToken='';throw new Error(data?.error||'Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.');}
    if(!response.ok) throw new Error(data?.error||`Máy chủ trả lỗi ${response.status}`);

function loadImageFast(file) {

    const url = URL.createObjectURL(file);
    const img = new Image();
    const done = (fn, value) => { URL.revokeObjectURL(url); fn(value); };
    img.onload = () => resolve({ img, revoke: () => URL.revokeObjectURL(url) });
    img.onerror = () => done(reject, new Error('Không đọc được ảnh này. Hãy chụp lại hoặc chọn ảnh JPG/PNG.'));
    img.src = url;
  });

  // iPhone có thể treo createImageBitmap với HEIC; dùng <img> + canvas một lần sẽ ổn định hơn.
  const loaded = await withTimeout(loadImageFast(file), 12000, 'Không đọc được ảnh trong 12 giây');
  try {
    const img = loaded.img;
    const sw = img.naturalWidth || img.width;
    const sh = img.naturalHeight || img.height;
    if (!sw || !sh) throw new Error('Ảnh không có kích thước hợp lệ');
    const scale = Math.min(1, IMAGE_MAX_SIDE / Math.max(sw, sh));
    let width = Math.max(1, Math.round(sw * scale));
    let height = Math.max(1, Math.round(sh * scale));
    const render = async (w, h, quality) => {
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d', { alpha: false });
      if (!ctx) throw new Error('Thiết bị không tạo được ảnh nén');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      return canvasToBlob(canvas, 'image/jpeg', quality);
    };
    let blob = await render(width, height, 0.76);
    if (blob.size > IMAGE_TARGET_BYTES) {
      const scale2 = Math.min(1, 1100 / Math.max(width, height));
      width = Math.max(1, Math.round(width * scale2));
      height = Math.max(1, Math.round(height * scale2));
      blob = await render(width, height, 0.68);
    }
    return blob;
  } finally {
    loaded.revoke();
  }
}
